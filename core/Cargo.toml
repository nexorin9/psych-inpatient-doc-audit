[workspace]
resolver = "2"
members = [
    "crates/psychdoc-model",
    "crates/psychdoc-parse",
    "crates/psychdoc-rules",
    "crates/psychdoc-graph",
    "crates/psychdoc-fhir",
    "crates/psychdoc-store",
    "crates/psychdoc-ffi",
    "crates/psychdoc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
ureq = { version = "2", features = ["json", "tls"] }
regex = "1"
